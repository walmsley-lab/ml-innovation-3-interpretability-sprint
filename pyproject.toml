[project]
name = "dsi"
version = "0.0.1"
description = "Developmental system identification for pretraining"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.35",
    "equinox>=0.11",
    "optax>=0.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "polars>=1.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
